name: Validate Ultimate AI Models & API Directory

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    name: Check Markdown Tables & Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate README tables, anchors & HTTPS links
        run: python3 scripts/validate_list.py
